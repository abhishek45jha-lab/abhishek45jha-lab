<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Abhishek Jha — Cricket Portfolio</title>
<desc id="desc">Animated cricket-themed portfolio banner. Click to open the full interactive portfolio.</desc>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#111b3b"/><stop offset="54%" stop-color="#8a4561"/><stop offset="100%" stop-color="#f7a65b"/>
  </linearGradient>
  <radialGradient id="sun">
    <stop offset="0%" stop-color="#fff5c4"/><stop offset="55%" stop-color="#ffd17e" stop-opacity=".95"/><stop offset="100%" stop-color="#ff8a59" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#09152b" stop-opacity=".94"/><stop offset="100%" stop-color="#152847" stop-opacity=".80"/>
  </linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="round"><rect x="5" y="5" width="1190" height="665" rx="26"/></clipPath>
  <style>
    .nav { font: 700 17px 'Trebuchet MS',sans-serif; fill:#fff4dc; letter-spacing:.7px; }
    .small { font: 600 14px 'Trebuchet MS',sans-serif; fill:#fff0d6; letter-spacing:2px; }
    .title { font: 900 48px 'Trebuchet MS',sans-serif; fill:#fff7e8; letter-spacing:1px; }
    .body { font: 500 19px 'Trebuchet MS',sans-serif; fill:#fff1dc; }
    .button { fill:#171e3d; fill-opacity:.84; stroke:#ffd08b; stroke-width:2; }
    .leaf { animation: drift 10s linear infinite; transform-box:fill-box; }
    .leaf.two { animation-duration:13s; animation-delay:-4s; }
    .spark { animation: twinkle 2.5s ease-in-out infinite alternate; }
    .spark.s2 { animation-delay:-1.1s; }
    .spark.s3 { animation-delay:-1.8s; }
    .sunhalo { animation: breathe 5s ease-in-out infinite; transform-origin:850px 360px; }
    .pulse { animation: pulse 2.2s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
    @keyframes drift { 0%{transform:translate(0,-50px) rotate(0deg);opacity:0} 12%{opacity:.8} 85%{opacity:.6} 100%{transform:translate(95px,700px) rotate(260deg);opacity:0} }
    @keyframes twinkle { from{opacity:.2;transform:scale(.7)} to{opacity:1;transform:scale(1.2)} }
    @keyframes breathe { 0%,100%{opacity:.65;transform:scale(.96)} 50%{opacity:1;transform:scale(1.06)} }
    @keyframes pulse { 0%,100%{filter:drop-shadow(0 0 1px #ffbd76)} 50%{filter:drop-shadow(0 0 9px #ffbd76)} }
    @media (prefers-reduced-motion: reduce) { .leaf,.spark,.sunhalo,.pulse { animation:none; } }
  </style>
</defs>
<a xlink:href="https://abhishek45jha-lab.github.io/" target="_blank" rel="noopener">
<g clip-path="url(#round)">
  <rect width="1200" height="675" fill="url(#sky)"/>
  <circle class="sunhalo" cx="850" cy="360" r="250" fill="url(#sun)"/>
  <circle cx="850" cy="360" r="76" fill="#ffdb91" opacity=".78"/>
  <path d="M0 405 Q130 360 250 405 T500 398 T760 408 T1000 390 T1200 410 V675 H0Z" fill="#25304b" opacity=".8"/>
  <path d="M0 470 Q170 430 330 470 T680 460 T980 465 T1200 450 V675 H0Z" fill="#17253a"/>
  <path d="M0 555 Q260 515 510 555 T1000 540 T1200 552 V675 H0Z" fill="#101d2d"/>
  <path d="M0 610 Q240 590 490 615 T930 600 T1200 610 V675 H0Z" fill="#0a1725"/>
  <!-- stadium lights -->
  <g opacity=".9" filter="url(#glow)">
    <path d="M94 300 L94 460 M1080 270 L1080 438" stroke="#29364d" stroke-width="9"/>
    <g fill="#fff4ce"><circle cx="75" cy="285" r="5"/><circle cx="92" cy="280" r="5"/><circle cx="109" cy="285" r="5"/><circle cx="1050" cy="258" r="5"/><circle cx="1068" cy="252" r="5"/><circle cx="1086" cy="258" r="5"/></g>
  </g>
  <!-- cricket pitch and wickets -->
  <path d="M455 675 L565 495 L655 495 L765 675Z" fill="#bd8c66" opacity=".72"/>
  <g stroke="#ffe7b2" stroke-width="5" stroke-linecap="round"><path d="M590 505 v-26 M602 505 v-26 M614 505 v-26 M584 480 h36"/></g>
  <!-- stylized batter silhouette -->
  <g transform="translate(820 390)">
    <ellipse cx="0" cy="176" rx="82" ry="13" fill="#080f1d" opacity=".6"/>
    <circle cx="0" cy="0" r="29" fill="#172033" stroke="#f6c38a" stroke-width="3"/>
    <path d="M-27 -5 Q-15 -39 14 -27 Q28 -16 27 5 L-26 8Z" fill="#0a1223"/>
    <path d="M-25 31 Q0 20 25 34 L42 103 L16 133 L-30 122 L-45 64Z" fill="#1a2b48" stroke="#f0b879" stroke-width="3"/>
    <path d="M-34 45 L-68 88 L-56 101 L-10 70 M32 45 L70 15 L83 25 L48 78" fill="none" stroke="#1a2b48" stroke-width="19" stroke-linecap="round"/>
    <path d="M-30 121 L-39 171 L-12 174 L4 132 M15 128 L25 173 L49 171 L42 113" fill="none" stroke="#0c1627" stroke-width="22" stroke-linecap="round"/>
    <path d="M-10 58 L10 60" stroke="#ffda98" stroke-width="3"/>
    <path d="M78 25 L130 -58" stroke="#f2d3a0" stroke-width="12" stroke-linecap="round"/>
    <path d="M124 -68 L137 -88" stroke="#fff0c5" stroke-width="7" stroke-linecap="round"/>
  </g>
  <!-- animated floating leaves / sparks -->
  <g fill="#f8cb8b">
    <ellipse class="leaf" cx="170" cy="80" rx="5" ry="12" transform="rotate(-35 170 80)"/>
    <ellipse class="leaf two" cx="1030" cy="80" rx="5" ry="12" transform="rotate(35 1030 80)"/>
    <ellipse class="leaf" cx="560" cy="150" rx="4" ry="10" transform="rotate(50 560 150)"/>
    <circle class="spark" cx="730" cy="235" r="3"/><circle class="spark s2" cx="930" cy="190" r="4"/><circle class="spark s3" cx="660" cy="320" r="3"/>
    <circle class="spark s2" cx="1040" cy="390" r="3"/><circle class="spark" cx="430" cy="260" r="3"/><circle class="spark s3" cx="230" cy="400" r="4"/>
  </g>
  <!-- readable interface overlay -->
  <rect x="30" y="25" width="1140" height="68" rx="17" fill="#081426" fill-opacity=".78" stroke="#f7c987" stroke-opacity=".55"/>
  <text x="55" y="66" class="small">AJ / 07</text>
  <text x="175" y="67" class="nav">HOME</text>
  <text x="270" y="67" class="nav">ABOUT</text>
  <text x="378" y="67" class="nav">PROJECTS</text>
  <text x="510" y="67" class="nav">SKILLS</text>
  <text x="600" y="67" class="nav">ACHIEVEMENTS</text>
  <text x="795" y="67" class="nav">CONTACT</text>
  <path d="M175 77 H226" stroke="#ffd08b" stroke-width="3" class="pulse"/>
  <rect x="55" y="150" width="590" height="300" rx="24" fill="url(#panel)" stroke="#ffd08b" stroke-opacity=".72"/>
  <text x="90" y="198" class="small">CRICKET • CODE • CREATIVITY</text>
  <text x="88" y="260" class="title">ABHISHEK</text>
  <text x="88" y="316" class="title">JHA</text>
  <text x="92" y="356" class="body">Developer in progress. Dreaming big.</text>
  <text x="92" y="385" class="body">Building projects, learning every day.</text>
  <rect x="90" y="408" width="208" height="46" rx="12" class="button pulse"/>
  <text x="194" y="437" text-anchor="middle" class="nav">EXPLORE MY WORLD</text>
  <rect x="313" y="408" width="166" height="46" rx="12" class="button"/>
  <text x="396" y="437" text-anchor="middle" class="nav">GET IN TOUCH</text>
  <rect x="55" y="493" width="1090" height="118" rx="20" fill="#071426" fill-opacity=".76" stroke="#f7c987" stroke-opacity=".4"/>
  <text x="85" y="531" class="small">CURRENTLY EXPLORING</text>
  <text x="85" y="570" class="body">Data Science  •  C++ / DSA  •  AI Projects  •  Web Development</text>
  <text x="85" y="596" font-family="Trebuchet MS,sans-serif" font-size="13" fill="#fbd8a7">CLICK ANYWHERE TO OPEN THE FULL INTERACTIVE PORTFOLIO ↗</text>
  <rect x="5" y="5" width="1190" height="665" rx="26" fill="none" stroke="#ffd08b" stroke-width="3" stroke-opacity=".7"/>
</g>
</a>
</svg>